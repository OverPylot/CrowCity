name: Deploy CrowCity to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Find CrowCity
        id: website
        shell: bash
        run: |
          for directory in "dist" "CrowCity/dist" "."; do
            if [ -f "$directory/index.html" ]; then
              echo "path=$directory" >> "$GITHUB_OUTPUT"
              echo "CrowCity found: $directory/index.html"
              exit 0
            fi
          done

          echo "::error::CrowCity index.html not found. Upload the extracted project files."
          exit 1

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload CrowCity
        uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ steps.website.outputs.path }}

      - name: Publish CrowCity
        id: deployment
        uses: actions/deploy-pages@v5
